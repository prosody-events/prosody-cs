# Shared dev stack. This project name matches the prosody repo's compose project,
# so both repos drive one set of containers. That repo declares no name, so its
# project name comes from its directory: keep it checked out as `prosody`.
# Keep the service definitions in the two files identical.
name: prosody
services:
  lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000" # Grafana UI
      - "4317:4317" # OTLP gRPC ingest
      - "4318:4318" # OTLP HTTP ingest
      - "3200:3200" # Tempo API
    volumes:
      - lgtm_data:/data
    environment:
      GF_PATHS_DATA: /data/grafana

  kafka:
    image: apache/kafka:latest
    ports:
      - "9094:9094"
    volumes:
      - "kafka_data:/var/lib/kafka/data"
    environment:
      # KRaft settings
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single-node settings - required for internal topics
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Local dev: don't hold the initial rebalance of a new consumer group (default 3000ms) —
      # shaves ~3s off first delivery for every fresh group id.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Point the log dir at the mounted volume — the image's default log dir is NOT
      # /var/lib/kafka/data, so without this the kafka_data volume persists nothing and
      # every container recreate silently drops all topics.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 15s
      timeout: 10s
      retries: 15
  cassandra:
    image: cassandra:latest
    ports:
      - "9042:9042"
    environment:
      # Advertise the host-reachable address. Without this the node reports its
      # internal Docker IP, and host-run tests fail after driver peer discovery.
      CASSANDRA_BROADCAST_ADDRESS: 127.0.0.1
      CASSANDRA_BROADCAST_RPC_ADDRESS: 127.0.0.1
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: [ "CMD-SHELL", "cqlsh -e 'SELECT cluster_name FROM system.local;'" ]
      interval: 15s
      timeout: 10s
      retries: 15
  console:
    image: docker.redpanda.com/redpandadata/console:latest
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["kafka:9092"]
    ports:
      - "8080:8080"
    depends_on:
      - kafka
volumes:
  kafka_data:
  cassandra_data:
  lgtm_data:
