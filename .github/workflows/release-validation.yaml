name: Release Package Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .dockerignore
      - .github/docker/**
      - .github/workflows/release.yaml
      - .github/workflows/release-validation.yaml
      - Cargo.lock
      - Cargo.toml
      - Cross.toml
      - ffi/**
      - src/**
      - test/**
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build ${{ matrix.target.rid }} package library
    strategy:
      fail-fast: false
      matrix:
        target:
          - rid: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - rid: linux-arm64
            rust_target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build in compatibility container
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: .github/docker/linux-release.Dockerfile
          target: artifact
          build-args: RUST_TARGET=${{ matrix.target.rust_target }}
          outputs: type=local,dest=ffi/artifacts/${{ matrix.target.rid }}
          cache-from: type=gha,scope=linux-${{ matrix.target.rust_target }}
          cache-to: type=gha,mode=max,scope=linux-${{ matrix.target.rust_target }}

      - name: Upload native library
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target.rid }}
          path: ffi/artifacts/${{ matrix.target.rid }}/
          if-no-files-found: error

  build-package:
    name: Build validation package
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: cmake libcurl4-openssl-dev
          version: 1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust (nightly for fmt)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install uniffi-bindgen-cs
        uses: baptiste0928/cargo-install@v3
        with:
          crate: uniffi-bindgen-cs
          git: https://github.com/NordSecurity/uniffi-bindgen-cs.git
          tag: v0.11.0+v0.31.0

      - name: Install CSharpier globally
        run: dotnet tool install -g csharpier

      - name: Download native library
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: ffi/artifacts/
          merge-multiple: false

      - name: Reorganize native libraries
        run: |
          for directory in ffi/artifacts/native-*; do
            rid="${directory##*/native-}"
            mv "$directory" "ffi/artifacts/$rid"
          done

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Build FFI for binding generation
        run: cargo build -p prosody-ffi

      - name: Generate C# bindings
        run: make bindgen

      - name: Pack
        run: |
          dotnet pack src/Prosody/Prosody.csproj \
            --configuration Release \
            -p:PackageVersion=0.0.0-validation \
            -p:ContinuePackingAfterGeneratingNuspec=true \
            -p:ContinuousIntegrationBuild=true \
            --output packages

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: validation-package
          path: packages/*.nupkg
          if-no-files-found: error

  test-package:
    name: Test ${{ matrix.target.rid }} package (.NET ${{ matrix.dotnet }})
    needs: build-package
    strategy:
      fail-fast: false
      matrix:
        target:
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
        dotnet: ["8.0", "9.0", "10.0"]
    runs-on: ${{ matrix.target.runner }}
    services:
      kafka:
        image: apache/kafka:latest
        ports:
          - 9094:9094
        env:
          KAFKA_NODE_ID: 0
          KAFKA_PROCESS_ROLES: controller,broker
          KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s
      cassandra:
        image: cassandra:latest
        ports:
          - 9042:9042
        options: >-
          --health-cmd "cqlsh -e 'SELECT cluster_name FROM system.local'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 15
          --health-start-period 60s
    steps:
      - uses: actions/checkout@v7

      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: validation-package
          path: packages/

      - name: Test installed package
        run: |
          docker run --rm --network host \
            -e PROSODY_BOOTSTRAP_SERVERS=localhost:9094 \
            -e PROSODY_CASSANDRA_NODES=localhost:9042 \
            -e PROSODY_CASSANDRA_KEYSPACE=prosody_test \
            -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
            -e DOTNET_NOLOGO=1 \
            -e NUGET_PACKAGES=/tmp/prosody-release-packages \
            -e NUGET_HTTP_CACHE_PATH=/tmp/prosody-release-http-cache \
            --volume "${{ github.workspace }}:/workspace" \
            --workdir /workspace \
            mcr.microsoft.com/dotnet/sdk:${{ matrix.dotnet }} \
            bash -c '
              dotnet restore test/Prosody.Tests \
                -p:TestPackage=true \
                -p:TestPackageVersion=0.0.0-validation \
                --configfile /workspace/.github/nuget-release-test.config \
                /p:TargetFramework=net${{ matrix.dotnet }} &&
              dotnet run --project test/Prosody.Tests \
                --framework net${{ matrix.dotnet }} \
                --no-restore \
                --no-launch-profile \
                --configuration Release \
                -p:TestPackage=true \
                -p:TestPackageVersion=0.0.0-validation
            '
