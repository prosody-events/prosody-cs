name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      retry_version:
        description: Rebuild and publish an existing release without running Release Please
        required: false
        type: string
      release_as:
        description: 'Force release version (e.g. 2.2.0-beta.1)'
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0

  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release_context.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release_context.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Release Please Action
        if: inputs.retry_version == ''
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.GH_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          release-as: ${{ github.event.inputs.release_as }}

      - name: Resolve release context
        id: release_context
        shell: bash
        env:
          RETRY_VERSION: ${{ inputs.retry_version }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_MAJOR: ${{ steps.release.outputs.major }}
          RELEASE_MINOR: ${{ steps.release.outputs.minor }}
          RELEASE_PATCH: ${{ steps.release.outputs.patch }}
        run: |
          if [[ -n "$RETRY_VERSION" ]]; then
            version="$RETRY_VERSION"
            release_created=true
          elif [[ "$RELEASE_CREATED" == "true" ]]; then
            version="${RELEASE_MAJOR}.${RELEASE_MINOR}.${RELEASE_PATCH}"
            release_created=true
          else
            version=
            release_created=false
          fi

          if [[ "$release_created" == "true" && -z "$version" ]]; then
            echo "::error::A release was created without a version"
            exit 1
          fi

          echo "release_created=$release_created" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-native:
    name: Build Native (${{ matrix.target.rid }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - rid: win-x64
            rust_target: x86_64-pc-windows-msvc
            runner: windows-latest
            lib_prefix: ""
            lib_ext: .dll

          - rid: win-arm64
            rust_target: aarch64-pc-windows-msvc
            runner: windows-latest
            lib_prefix: ""
            lib_ext: .dll

          - rid: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            lib_prefix: lib
            lib_ext: .so
            use_docker: true
            rustflags: -C target-cpu=x86-64-v3 -C link-arg=-fuse-ld=mold

          - rid: linux-arm64
            rust_target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            lib_prefix: lib
            lib_ext: .so
            use_docker: true
            rustflags: -C link-arg=-fuse-ld=mold

          - rid: osx-arm64
            rust_target: aarch64-apple-darwin
            runner: macos-14
            lib_prefix: lib
            lib_ext: .dylib

    steps:
      - uses: actions/checkout@v7

      - name: Install protobuf compiler
        if: runner.os != 'Linux'
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "25.9"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux' && !matrix.target.use_docker
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: cmake libcurl4-openssl-dev protobuf-compiler
          version: 1.0

      - name: Setup Rust
        if: '!matrix.target.use_docker'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.rust_target }}

      - name: Cache Rust
        if: '!matrix.target.use_docker'
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target.rid }}

      - name: Set up Docker Buildx
        if: matrix.target.use_docker
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build native library
        if: '!matrix.target.use_docker'
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_DEBUG: 2
        run: cargo build -p prosody_ffi --release --target ${{ matrix.target.rust_target }}

      - name: Build native library in compatibility container
        if: matrix.target.use_docker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .github/docker/linux-release.Dockerfile
          target: artifact
          build-args: |
            RUST_TARGET=${{ matrix.target.rust_target }}
            RUSTFLAGS=${{ matrix.target.rustflags }}
          outputs: type=local,dest=target/${{ matrix.target.rust_target }}/release
          cache-from: type=gha,scope=linux-${{ matrix.target.rust_target }}
          cache-to: type=gha,mode=max,scope=linux-${{ matrix.target.rust_target }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p artifacts/${{ matrix.target.rid }}
          mkdir -p symbols/${{ matrix.target.rid }}
          cp target/${{ matrix.target.rust_target }}/release/${{ matrix.target.lib_prefix }}prosody_ffi${{ matrix.target.lib_ext }} \
             artifacts/${{ matrix.target.rid }}/

          case "${{ matrix.target.rid }}" in
            linux-*)
              cp target/${{ matrix.target.rust_target }}/release/symbols/libprosody_ffi.so.debug \
                 symbols/${{ matrix.target.rid }}/
              ;;
            osx-*)
              dsymutil target/${{ matrix.target.rust_target }}/release/libprosody_ffi.dylib \
                -o symbols/${{ matrix.target.rid }}/libprosody_ffi.dylib.dSYM
              strip -S artifacts/${{ matrix.target.rid }}/libprosody_ffi.dylib
              ;;
            win-*)
              cp target/${{ matrix.target.rust_target }}/release/prosody_ffi.pdb \
                 symbols/${{ matrix.target.rid }}/
              ;;
          esac

      - name: Upload native artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target.rid }}
          path: artifacts/${{ matrix.target.rid }}/
          if-no-files-found: error

      - name: Upload native symbols
        uses: actions/upload-artifact@v7
        with:
          name: symbols-${{ matrix.target.rid }}
          path: symbols/${{ matrix.target.rid }}/
          if-no-files-found: error

  build-package:
    name: Build NuGet Package
    needs: [release-please, build-native]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: cmake libcurl4-openssl-dev protobuf-compiler
          version: 1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust (nightly for fmt)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install BoltFFI
        uses: baptiste0928/cargo-install@v3
        with:
          crate: boltffi_cli
          version: 0.30.1

      - name: Download all native artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: artifacts/
          merge-multiple: false

      - name: Reorganize artifacts for NuGet packing
        run: |
          # Create ffi/artifacts structure expected by Prosody.csproj
          mkdir -p ffi/artifacts
          cd artifacts
          for dir in native-*; do
            rid="${dir#native-}"
            mv "$dir" "../ffi/artifacts/$rid"
          done
          cd ../ffi/artifacts
          ls -laR

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Build FFI (for bindgen only, not packaging)
        run: cargo build -p prosody_ffi

      - name: Generate C# bindings
        run: make bindgen

      - name: Pack NuGet package
        run: |
          dotnet pack src/Prosody/Prosody.csproj \
            -c Release \
            -p:PackageVersion=${{ needs.release-please.outputs.version }} \
            -p:ContinuePackingAfterGeneratingNuspec=true \
            -p:ContinuousIntegrationBuild=true \
            -o ./packages

      - name: Upload NuGet package
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: |
            packages/*.nupkg
            packages/*.snupkg
          if-no-files-found: error

  test:
    name: Test ${{ matrix.target.name }} (.NET ${{ matrix.dotnet }})
    needs: [release-please, build-package]
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: linux-x64
            runner: ubuntu-latest
          - name: linux-arm64
            runner: ubuntu-24.04-arm
        dotnet: ["8.0", "9.0", "10.0"]

    steps:
      - uses: actions/checkout@v7

      - name: Download NuGet package
        uses: actions/download-artifact@v8
        with:
          name: nuget-package
          path: ./packages

      - name: Download native symbols
        uses: actions/download-artifact@v8
        with:
          name: symbols-${{ matrix.target.name }}
          path: /tmp/prosody-test-diagnostics/symbols/

      - name: Start healthy dependencies
        run: docker compose --project-name release-test up --detach --wait kafka cassandra

      - name: Run tests
        run: |
          mkdir -p /tmp/prosody-test-diagnostics
          docker run --rm --network release-test_default \
            -e PROSODY_BOOTSTRAP_SERVERS=kafka:9092 \
            -e PROSODY_CASSANDRA_NODES=cassandra:9042 \
            -e PROSODY_CASSANDRA_KEYSPACE=prosody_test \
            -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
            -e DOTNET_NOLOGO=1 \
            -e NUGET_PACKAGES=/tmp/prosody-release-packages \
            -e NUGET_HTTP_CACHE_PATH=/tmp/prosody-release-http-cache \
            -e DOTNET_DbgEnableMiniDump=1 \
            -e DOTNET_DbgMiniDumpType=4 \
            -e DOTNET_DbgMiniDumpName=/diagnostics/prosody-%p.dmp \
            -v ${{ github.workspace }}:/workspace \
            -v /tmp/prosody-test-diagnostics:/diagnostics \
            -w /workspace \
            mcr.microsoft.com/dotnet/sdk:${{ matrix.dotnet }} \
            bash -c "
              # Restore for specific framework only (SDK may not support other frameworks)
              dotnet restore test/Prosody.Tests -p:TestPackage=true \
                -p:TestPackageVersion=${{ needs.release-please.outputs.version }} \
                --configfile /workspace/.github/nuget-release-test.config \
                /p:TargetFramework=net${{ matrix.dotnet }}

              # Run tests using the NuGet package (not ProjectReference)
              # --no-launch-profile prevents launchSettings.json from overriding
              # PROSODY_BOOTSTRAP_SERVERS with localhost:9094 (which is unreachable
              # from inside this container; Kafka is at kafka:9092 on the Docker network).
              dotnet run --project test/Prosody.Tests --framework net${{ matrix.dotnet }} --no-restore --no-launch-profile -c Release \
                -p:TestPackage=true -p:TestPackageVersion=${{ needs.release-please.outputs.version }} \
                -- --diagnostic --diagnostic-synchronous-write \
                --diagnostic-output-directory /diagnostics --timeout 5m
            "

      - name: Make failure diagnostics readable
        if: failure()
        run: sudo chmod --recursive a+rX /tmp/prosody-test-diagnostics

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-test-diagnostics-${{ matrix.target.name }}-net${{ matrix.dotnet }}
          path: /tmp/prosody-test-diagnostics/
          if-no-files-found: warn

  publish:
    name: Publish
    needs: [release-please, build-package, test]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write   # request the OIDC token for NuGet trusted publishing
      contents: read
    steps:
      - name: Download NuGet package
        uses: actions/download-artifact@v8
        with:
          name: nuget-package
          path: packages/

      - name: NuGet login (OIDC -> short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push packages/*.nupkg \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate
