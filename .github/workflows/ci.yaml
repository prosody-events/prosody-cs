name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Run daily at midnight UTC to catch new security advisories
    - cron: "0 0 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0

  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

permissions:
  contents: write

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      required-work: ${{ steps.rail.outputs.required-work }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Restore planning evidence
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: target/planning-evidence
          key: cargo-rail-evidence-${{ runner.os }}-${{ runner.arch }}-${{ github.event.pull_request.base.sha || github.event.before }}
      # The Action rejects a missing evidence path. An empty directory after a cache miss only widens the plan.
      - name: Create the evidence directory
        run: mkdir -p target/planning-evidence
      - id: rail
        uses: loadingalias/cargo-rail-action@409962f05d90a78aae995ef6b1c8466010c0a460 # v10.1.1
        with:
          all: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          evidence: target/planning-evidence

  # This job records the inputs that each Cargo work item reads at this commit.
  # The plan job of a later change restores them to skip work that the change cannot affect.
  # Keep the Cargo environment of this job equal to the plan job, or the evidence does not apply.
  # A separate job records evidence on every push. The routed jobs can skip, and their RUSTFLAGS would not match the plan job.
  evidence:
    name: Planning evidence
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install build dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: cmake libcurl4-openssl-dev protobuf-compiler
          version: 1.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Setup Cargo-Rail
        uses: loadingalias/cargo-rail-action/setup@409962f05d90a78aae995ef6b1c8466010c0a460 # v10.1.1

      # Do not record Clippy evidence: Cargo-Rail 0.30.1 marks it incomplete when the clippy::cargo lints run cargo metadata.
      # cargo.clippy and cargo.doc have no complete evidence. Their jobs route on cargo.build and cargo.test, whose evidence covers the same compiler inputs.
      - name: Record planning evidence
        run: |
          cargo rail plan evidence --work cargo.build --output target/planning-evidence/cargo.build.json -- build --locked --workspace --all-features
          cargo rail plan evidence --work cargo.test --output target/planning-evidence/cargo.test.json -- test --locked --workspace --all-features --no-run

      - name: Save planning evidence
        uses: actions/cache/save@v6
        with:
          path: target/planning-evidence
          key: cargo-rail-evidence-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

  test:
    name: Test
    needs: plan
    if: >-
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.build') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.test') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'dotnet') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'ci')
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C target-cpu=x86-64-v3 -C link-arg=-fuse-ld=mold
    services:
      kafka:
        image: apache/kafka:latest
        ports:
          - 9094:9094
        env:
          KAFKA_NODE_ID: 0
          KAFKA_PROCESS_ROLES: controller,broker
          KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s

      cassandra:
        image: cassandra:latest
        ports:
          - 9042:9042
        options: >-
          --health-cmd "cqlsh -e 'SELECT cluster_name FROM system.local'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 15
          --health-start-period 60s

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: cmake libcurl4-openssl-dev protobuf-compiler
          version: 1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup mold
        uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1
        with:
          make-default: false

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install uniffi-bindgen-cs
        uses: baptiste0928/cargo-install@v3
        with:
          crate: uniffi-bindgen-cs
          git: https://github.com/NordSecurity/uniffi-bindgen-cs.git
          tag: v0.11.0+v0.31.0

      - name: Install CSharpier globally (for uniffi-bindgen-cs auto-formatting)
        run: dotnet tool install -g csharpier

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Build FFI and generate bindings
        run: make build-ci

      - name: Run Rust tests
        run: cargo test -p prosody-ffi

      - name: Run tests
        run: dotnet run --project test/Prosody.Tests --framework net10.0 --no-build --no-launch-profile -c Release
        env:
          PROSODY_BOOTSTRAP_SERVERS: localhost:9094
          PROSODY_CASSANDRA_NODES: localhost:9042
          PROSODY_CASSANDRA_KEYSPACE: prosody_test

  dotnet-lint:
    name: .NET Lint
    needs: plan
    if: >-
      contains(fromJSON(needs.plan.outputs.required-work), 'dotnet') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.build') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'ci')
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C target-cpu=x86-64-v3 -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: cmake libcurl4-openssl-dev protobuf-compiler
          version: 1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup mold
        uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1
        with:
          make-default: false

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install uniffi-bindgen-cs
        uses: baptiste0928/cargo-install@v3
        with:
          crate: uniffi-bindgen-cs
          git: https://github.com/NordSecurity/uniffi-bindgen-cs.git
          tag: v0.11.0+v0.31.0

      - name: Install CSharpier globally (for uniffi-bindgen-cs auto-formatting)
        run: dotnet tool install -g csharpier

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Build FFI and generate bindings
        run: make build-ci

      - name: Run C# lint
        run: make lint-csharp

  fmt:
    name: Format
    needs: plan
    if: >-
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.fmt') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'taplo') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.build') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.test') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'dotnet') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'ci')
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C target-cpu=x86-64-v3 -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Setup mold
        uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1
        with:
          make-default: false

      - name: Install taplo
        uses: baptiste0928/cargo-install@v3
        with:
          crate: taplo-cli

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Check formatting
        run: make format-check

  dependencies:
    name: Unused Dependencies
    needs: plan
    if: >-
      contains(fromJSON(needs.plan.outputs.required-work), 'dependency-policy') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.build') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.test') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'ci')
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C target-cpu=x86-64-v3 -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: cmake libcurl4-openssl-dev protobuf-compiler
          version: 1.0

      - name: Setup Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Setup mold
        uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1
        with:
          make-default: false

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-udeps
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-udeps

      - name: Check unused dependencies
        run: cargo +nightly udeps

  docs:
    name: Documentation
    needs: plan
    if: >-
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.build') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'ci')
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C target-cpu=x86-64-v3 -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: cmake libcurl4-openssl-dev protobuf-compiler
          version: 1.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup mold
        uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1
        with:
          make-default: false

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

  clippy:
    name: Clippy
    needs: plan
    if: >-
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.build') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.test') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'ci')
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C target-cpu=x86-64-v3 -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: cmake libcurl4-openssl-dev protobuf-compiler
          version: 1.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup mold
        uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1
        with:
          make-default: false

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: make lint-rust
